# Server-Konfiguration
server.port=8080
spring.application.name=risiko-simulation

# Actuator: nur Health- und Info-Endpunkte freigeben
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# OpenAPI/Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Jackson: lesbare JSON-Ausgabe
spring.jackson.serialization.indent-output=true

# Logging: nur Warnungen und Fehler der eigenen Pakete
logging.level.io.github.muaiso.risiko=INFO
logging.level.org.springframework=WARN
